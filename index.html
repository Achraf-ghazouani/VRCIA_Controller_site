<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WebSocket Color Controller">
    <title>Color Controller</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main container for centered content -->
    <div class="container">
        <!-- Header section with title and connection status -->
        <header class="header">
            <h1>Color Controller</h1>
            <div class="status-container">
                <span class="status-label">Status:</span>
                <span id="connectionStatus" class="status disconnected">Disconnected</span>
            </div>
        </header>

        <!-- Main content area with color buttons -->
        <main class="main-content">
            <div class="button-grid">
                <!-- Color control buttons -->
                <button class="color-btn" style="background-color: #4682B4;" data-color="#4682B4" data-name="Bleu">
                    Bleu
                </button>
                <button class="color-btn" style="background-color: #4CAF50;" data-color="#4CAF50" data-name="Vert">
                    Vert
                </button>
                <button class="color-btn" style="background-color: #FFD700; color: #000;" data-color="#FFD700" data-name="Jaune">
                    Jaune
                </button>
                <button class="color-btn" style="background-color: #DC143C;" data-color="#DC143C" data-name="Rouge">
                    Rouge
                </button>
                <button class="color-btn" style="background-color: #8A2BE2;" data-color="#8A2BE2" data-name="Violet">
                    Violet
                </button>
                <button class="color-btn" style="background-color: #F5F5F0; color: #000; border: 2px solid #334155;" data-color="#F5F5F0" data-name="Blanc Cassé">
                    Blanc Cassé
                </button>
                <button class="color-btn" style="background-color: #FF00FF;" data-color="#FF00FF" data-name="Magenta">
                    Magenta
                </button>
            </div>

            <!-- Message display area for user feedback -->
            <div id="messageDisplay" class="message-display"></div>
        </main>

        <!-- Footer with additional information -->
        <footer class="footer">
            <p>WebSocket Server: <code>wss://vrcia-controller-site.onrender.com</code></p>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
